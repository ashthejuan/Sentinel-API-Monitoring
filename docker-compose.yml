version: '3.8'

services:
  # Message Broker for Task Queuing
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"

  # Time-Series DB for Latency Metrics
  influxdb:
    image: influxdb:2.7
    container_name: sentinel_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-password123}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-sentinel_org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-latency_metrics}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-password123}
  # Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true # For easy local testing

      # - GF_AUTH_JWT_ENABLED=true
      # - GF_AUTH_JWT_URL_LOGIN=true # Allows passing token in URL
      # - GF_AUTH_JWT_HEADER_NAME=Authorization
      # Supabase local JWKS URL (allows Grafana to verify the token signature)
      # Note: We use host.docker.internal to route from the Grafana container to local Supabase
      # - GF_AUTH_JWT_JWK_SET_URL=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      # - GF_AUTH_JWT_EXPECTED_CLAIMS={"role":"authenticated"}
      # - GF_AUTH_JWT_USERNAME_CLAIM=sub
    depends_on:
      - influxdb